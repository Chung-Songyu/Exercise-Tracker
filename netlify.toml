# This file is used for deployment to Netlify
# https://docs.netlify.com/build/frameworks/framework-setup-guides/express/
[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# Netlify testing
[[redirects]]
  force = true
  from = "/hello"
  status = 200
  to = "/.netlify/functions/server/hello"

[[redirects]]
  force = true
  from = "/api/users/*"
  status = 200
  to = "/.netlify/functions/server/api/users/:splat"